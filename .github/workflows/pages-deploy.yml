# OPTIONAL "GitHub Actions publishing" mode. DISABLED BY DEFAULT: it only runs when you start it by hand.
#
# Today the site is published from the main branch (Settings -> Pages -> "Deploy from a branch"). In that mode you do NOT need this
# file: build the search index locally (npm run build:static) and publish it with the rest of the site; validate.yml checks it.
#
# Use this workflow only if you WANT GitHub to rebuild the index automatically on every publish:
#   1. Settings -> Pages -> Source: "GitHub Actions".
#   2. In this file replace the `workflow_dispatch:` trigger with `push: { branches: [main] }`.
# Differences from branch publishing: no Jekyll (so *.md files are served as plain files instead of being rendered), and a failed
# validation blocks the deployment (the previous site stays up).
# This workflow uses NO secrets; the only credential is the short-lived GITHUB_TOKEN/OIDC token that Pages deployment requires.
name: Deploy site (GitHub Actions publishing mode)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the source tree
        run: node .github/tools/check-site.mjs --skip-index

      - name: Build the search index from the public data
        run: node .github/tools/build-index.mjs --docs . --out vanta/data/index.json

      - name: Stage exactly what will be published (no .git, no .github)
        run: |
          mkdir _site
          tar --exclude=./.git --exclude=./.github --exclude=./_site -cf - . | tar -xf - -C _site
          touch _site/.nojekyll

      - name: Re-validate the staged tree (the exact bytes about to go public)
        run: node .github/tools/check-site.mjs --root _site --skip-index

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
